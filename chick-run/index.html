<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>啾啾快跑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D canvas; kraft-paper UI panels float above it like the clay tray in the photo. */
:root{
  --kraft:#c9a274; --kraft-dk:#9c7647; --yolk:#ffd84d; --comb:#ff6f2c; --cheek:#c4245c;
  --ink:#3b2a18; --cream:#fff7df; --paper:#f3e3c3; --leaf:#4f9a45;
  --f-display:"Fredoka","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;margin:0}
[hidden]{display:none!important}
body{background:var(--kraft);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:var(--f-body);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--comb);outline-offset:2px}
.layer{position:fixed;inset:0;pointer-events:none}
.layer > *{pointer-events:auto}

/* ---------- Viewer / title ---------- */
#title{display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));}
#title{pointer-events:none}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.logo{pointer-events:auto}
.logo h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:.02em;color:var(--cream);
  text-shadow:0 3px 0 var(--comb),0 6px 0 var(--kraft-dk),0 10px 18px rgba(60,35,10,.35)}
.logo p{margin:.55em 0 0;font-size:15px;color:var(--ink);background:rgba(255,247,223,.85);display:inline-block;padding:4px 10px;border-radius:999px}
.proto{pointer-events:auto;background:var(--cream);padding:6px 6px 4px;border-radius:6px;box-shadow:0 6px 16px rgba(60,35,10,.3);transform:rotate(3deg);width:92px;text-align:center;font-size:11px;flex-shrink:0}
.proto img{display:block;width:100%;border-radius:3px}
.proto span{display:block;margin-top:3px}
.view-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-bottom:12px}
.chip{border:0;background:rgba(255,247,223,.92);padding:7px 13px;border-radius:999px;font-size:14px;box-shadow:0 2px 0 var(--kraft-dk)}
.chip[aria-pressed="true"]{background:var(--yolk)}
.chip:active{transform:translateY(2px);box-shadow:none}
.levels{pointer-events:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px;width:100%;margin:0 auto}
.lv{border:0;text-align:left;border-radius:14px;padding:0;overflow:hidden;background:var(--cream);box-shadow:0 4px 0 var(--kraft-dk),0 10px 20px rgba(60,35,10,.25);display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.lv:hover{transform:translateY(-3px)}
.lv:active{transform:translateY(2px)}
.lv .pic{height:58px;position:relative}
.lv .pic b{position:absolute;left:10px;bottom:6px;font-family:var(--f-display);font-size:13px;color:#fff;background:rgba(0,0,0,.28);padding:1px 8px;border-radius:999px;letter-spacing:.04em}
.lv .txt{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lv .name{font-size:17px;font-weight:700}
.lv .meta{font-size:12px;color:#7a5a36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .best{font-size:12px;color:var(--comb);letter-spacing:.1em}
.pic-park{background:linear-gradient(#9fd8f5 0 45%,#6dbb52 45%)}
.pic-cks{background:linear-gradient(#bfe2ff 0 50%,#e9e6df 50%)}
.pic-oki{background:linear-gradient(#7fd3f7 0 42%,#2ab3c9 42% 62%,#f4dfa8 62%)}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.keys{text-align:center;font-size:12.5px;color:var(--ink);margin-top:10px;pointer-events:auto}
.keys kbd{font-family:var(--f-display);background:var(--cream);border-radius:5px;padding:1px 6px;box-shadow:0 2px 0 var(--kraft-dk)}

/* ---------- HUD ---------- */
#hud{padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.hud-row{display:flex;align-items:center;gap:10px;pointer-events:none}
.pill{background:rgba(255,247,223,.92);border-radius:999px;padding:6px 12px;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(156,118,71,.8);font-family:var(--f-display);font-weight:700}
.hearts{letter-spacing:2px;font-size:18px;color:var(--cheek)}
.hearts .off{color:#d9c8a8}
#bugCount.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.35)}}
.lvname{font-family:var(--f-body);font-weight:400}
.spacer{flex:1}
.iconbtn{pointer-events:auto;border:0;width:40px;height:40px;border-radius:50%;background:rgba(255,247,223,.92);box-shadow:0 3px 0 rgba(156,118,71,.8);font-size:16px;font-family:var(--f-display);font-weight:700}
.progress{margin-top:10px;height:12px;background:rgba(255,247,223,.6);border-radius:999px;position:relative;max-width:520px;margin-left:auto;margin-right:auto;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--yolk);border-radius:999px;width:0}
.progress em{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--yolk);border:2px solid var(--comb);left:0}
.progress u{position:absolute;right:-6px;top:-6px;font-size:16px;text-decoration:none}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(40px,9vw,84px);color:var(--cream);text-shadow:0 4px 0 var(--comb),0 9px 22px rgba(0,0,0,.3);pointer-events:none}
#banner small{display:block;font-family:var(--f-body);font-size:.32em;font-weight:400;color:var(--ink);text-shadow:none;margin-top:8px}
#banner span{display:inline-block;background:rgba(255,247,223,.9);padding:4px 14px;border-radius:999px}
.touchpad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.touchpad .grp{display:flex;gap:12px;pointer-events:auto}
.tbtn{border:0;width:64px;height:64px;border-radius:50%;background:rgba(255,247,223,.85);box-shadow:0 4px 0 rgba(156,118,71,.85);font-size:24px;font-family:var(--f-display);font-weight:700;touch-action:none}
.tbtn.jump{width:80px;height:80px;background:rgba(255,216,77,.92);font-size:18px}
.tbtn:active,.tbtn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(156,118,71,.85)}
@media (hover:hover) and (pointer:fine){ .touchpad{display:none} }

/* ---------- Modal ---------- */
#modal{display:flex;align-items:center;justify-content:center;background:rgba(59,42,24,.35);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--cream);border-radius:20px;padding:24px 22px 20px;width:min(380px,100%);text-align:center;box-shadow:0 8px 0 var(--kraft-dk),0 20px 40px rgba(0,0,0,.3);position:relative}
.card h2{margin:0;font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--comb);text-wrap:balance}
.card .sub{margin:4px 0 0;color:#7a5a36;font-size:14px}
.stars{font-size:40px;letter-spacing:6px;margin:10px 0 4px;color:var(--yolk);text-shadow:0 2px 0 var(--comb)}
.stars .off{color:#e2d3b5;text-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.stats div{background:var(--paper);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:#7a5a36}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:17px;background:var(--paper);box-shadow:0 3px 0 var(--kraft-dk)}
.btn.primary{background:var(--yolk);box-shadow:0 3px 0 #d79b18}
.btn:active{transform:translateY(2px);box-shadow:none}

@media (max-width:560px){
  .lv .pic{height:42px}
  .lv .name{font-size:15px}
  .lv .txt{padding:6px 8px 8px}
  .proto{width:72px}
  .keys{display:none}
}
@media (prefers-reduced-motion:reduce){ .lv,#bugCount.bump{transition:none;animation:none} }
</style>

<canvas id="c" tabindex="0" aria-label="3D 遊戲畫面"></canvas>

<section id="title" class="layer" aria-label="選擇關卡">
  <div class="top-row">
    <div class="logo">
      <h1>啾啾快跑</h1>
      <p id="dragHint">拖曳小雞 360° 旋轉・滾輪或雙指縮放</p>
    </div>
    <figure class="proto" style="margin:0">
      <img src="model.jpg" alt="黏土小雞原型照片" onerror="this.parentNode.hidden=true">

  <div>
    <div class="view-tools" role="group" aria-label="視角">

<section id="hud" class="layer" hidden>

    <button class="iconbtn" id="pauseBtn" aria-label="暫停">II</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="progFill"></i><em id="progChick"></em><u>🏁</u></div>
  <div class="touchpad" id="touchpad">
    <div class="grp">
      <button class="tbtn" id="tLeft" aria-label="往左">◀</button>
      <button class="tbtn" id="tRight" aria-label="往右">▶</button>
    </div>
    <div class="grp"><button class="tbtn jump" id="tJump" aria-label="跳躍">跳！</button></div>
  </div>
</section>
<div id="banner" hidden></div>

<section id="modal" class="layer" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">過關！</h2>
    <p class="sub" id="mSub"></p>
    <div class="stars" id="mStars"></div>
    <div class="stats" id="mStats"></div>
    <div class="actions" id="mActions"></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ================= Renderer ================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
function resize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 64 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

/* ================= Textures & materials ================= */
function makeCanvas(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h); return c;
}
function canvasTex(w, h, draw, repeat = true) {
  const t = new THREE.CanvasTexture(makeCanvas(w, h, draw));
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function speckle(ctx, w, h, n, colors, rMin, rMax) {
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = pick(colors);
    ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * h, rand(rMin, rMax), 0, 7); ctx.fill();
  }
}
// lumpy fingerprint-y clay bump map
const clayBump = canvasTex(256, 256, (x, w, h) => {
  x.fillStyle = '#808080'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 220; i++) {
    const r = rand(6, 30), cx = Math.random() * w, cy = Math.random() * h, v = (Math.random() * 60 - 30) | 0;
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    const c = 128 + v; g.addColorStop(0, `rgba(${c},${c},${c},.55)`); g.addColorStop(1, `rgba(${c},${c},${c},0)`);
    x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  x.strokeStyle = 'rgba(90,90,90,.35)'; x.lineWidth = 1.2;
  for (let i = 0; i < 40; i++) { x.beginPath(); const a = rand(0, w), b = rand(0, h); x.moveTo(a, b); x.quadraticCurveTo(a + rand(-20, 20), b + rand(-20, 20), a + rand(-30, 30), b + rand(-30, 30)); x.stroke(); }
});
clayBump.repeat.set(2, 2);
const MAT = {};
function clay(color, rough = 0.82) {
  const k = 'c' + color + rough;
  return MAT[k] || (MAT[k] = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0, bumpMap: clayBump, bumpScale: 0.012 }));
}
function flat(color, opts = {}) {
  const k = 'f' + color + JSON.stringify(opts);
  return MAT[k] || (MAT[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.9, metalness: 0, flatShading: true }, opts)));
}
const GEO = {
  sph: new THREE.SphereGeometry(1, 32, 24),
  sphLo: new THREE.SphereGeometry(1, 14, 10),
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 14),
  cyl8: new THREE.CylinderGeometry(1, 1, 1, 8),
  cone: new THREE.ConeGeometry(1, 1, 16),
  ico: new THREE.IcosahedronGeometry(1, 1),
  dode: new THREE.DodecahedronGeometry(1, 0),
};
function mesh(geo, mat, sx = 1, sy = 1, sz = 1, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  return m;
}

/* ================= The clay chick ================= */
const C = { yellow: 0xffe36a, pale: 0xfff0a6, orange: 0xff6a24, black: 0x1f1712, cheek: 0xb81f52 };
const BODY = { cy: 1.18, rx: 1.0, ry: 1.06, rz: 0.94 };
function onBody(x, y, push = 0) {
  const dx = x / BODY.rx, dy = (y - BODY.cy) / BODY.ry;
  const z = BODY.rz * Math.sqrt(Math.max(0, 1 - dx * dx - dy * dy));
  const n = new THREE.Vector3(x / (BODY.rx ** 2), (y - BODY.cy) / (BODY.ry ** 2), z / (BODY.rz ** 2)).normalize();
  return { p: new THREE.Vector3(x, y, z).addScaledVector(n, push), n };
}
function stick(obj, x, y, push = 0) {
  const { p, n } = onBody(x, y, push);
  obj.position.copy(p); obj.lookAt(p.clone().add(n)); return obj;
}
function buildChick() {
  const chick = new THREE.Group();
  const rig = new THREE.Group(); chick.add(rig);
  const Y = clay(C.yellow), P = clay(C.pale), O = clay(C.orange, 0.78), K = clay(C.black, 0.45), R = clay(C.cheek, 0.7);

  rig.add(mesh(GEO.sph, Y, BODY.rx, BODY.ry, BODY.rz, 0, BODY.cy, 0));
  // belly lump (slightly lower, clay is never a perfect sphere)
  rig.add(mesh(GEO.sph, Y, 0.82, 0.62, 0.7, 0, 0.78, 0.18));

  // eyes: left oval, right bean (as in the clay model)
  const eyeL = new THREE.Group(); eyeL.add(mesh(GEO.sph, K, 0.17, 0.125, 0.06, 0, 0, 0, false));
  eyeL.children[0].rotation.z = 0.15;
  stick(eyeL, -0.3, 1.5, 0.0);
  const eyeR = new THREE.Group();
  eyeR.add(mesh(GEO.sph, K, 0.15, 0.12, 0.06, 0.02, -0.02, 0, false));
  eyeR.add(mesh(GEO.sph, K, 0.1, 0.09, 0.055, 0.1, 0.05, 0, false));
  eyeR.add(mesh(GEO.sph, K, 0.09, 0.08, 0.055, -0.1, 0.04, 0, false));
  stick(eyeR, 0.32, 1.5, 0.0);
  rig.add(eyeL, eyeR);

  // cheeks
  const chL = mesh(GEO.sph, R, 0.17, 0.2, 0.05, 0, 0, 0, false); stick(chL, -0.56, 1.06, 0.0);
  const chR = mesh(GEO.sph, R, 0.17, 0.18, 0.05, 0, 0, 0, false); stick(chR, 0.6, 1.0, 0.0);
  rig.add(chL, chR);

  // beak: two pale lumps
  const bU = mesh(GEO.sph, P, 0.22, 0.13, 0.2); stick(bU, 0.0, 1.2, 0.06);
  const bD = mesh(GEO.sph, P, 0.17, 0.1, 0.15); stick(bD, 0.02, 1.03, 0.05);
  rig.add(bU, bD);

  // wings on pivots so they can flap
  const wings = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(s * 0.82, 1.32, -0.05);
    const w = mesh(GEO.sph, Y, 0.34, 0.56, 0.36, s * 0.32, 0.12, 0);
    w.rotation.z = s * -0.45;
    const tip = mesh(GEO.sph, Y, 0.2, 0.3, 0.26, s * 0.52, 0.5, -0.02);
    tip.rotation.z = s * -0.7;
    piv.add(w, tip); rig.add(piv); wings.push(piv);
  }

  // crest: two side blobs + stacked column + pointed tip
  const crest = new THREE.Group(); crest.position.set(0, 2.12, 0.05);
  for (const s of [-1, 1]) {
    const b = mesh(GEO.sph, O, 0.33, 0.26, 0.3, s * 0.4, 0.08, 0); b.rotation.z = s * -0.35; crest.add(b);
  }
  crest.add(mesh(GEO.sph, O, 0.26, 0.28, 0.26, 0, 0.3, 0));
  crest.add(mesh(GEO.sph, O, 0.24, 0.26, 0.24, 0.04, 0.68, 0));
  const tipPiv = new THREE.Group(); tipPiv.position.set(0.08, 0.86, 0);
  const tip1 = mesh(GEO.cone, O, 0.15, 0.42, 0.15, 0.06, 0.18, 0); tip1.rotation.z = -0.35;
  const tip2 = mesh(GEO.cone, O, 0.08, 0.3, 0.08, 0.22, 0.46, 0); tip2.rotation.z = -0.8;
  tipPiv.add(tip1, tip2); crest.add(tipPiv);
  rig.add(crest);

  // tail nub
  const tail = mesh(GEO.cone, Y, 0.25, 0.42, 0.18, 0, 1.0, -0.98); tail.rotation.x = -1.9; rig.add(tail);
  rig.add(mesh(GEO.sph, Y, 0.3, 0.26, 0.22, 0, 0.95, -0.82));

  // feet (stay on the ground, outside the rig)
  const feet = [];
  for (const s of [-1, 1]) {
    const f = new THREE.Group(); f.position.set(s * 0.42, 0, 0.2);
    f.add(mesh(GEO.sph, Y, 0.28, 0.2, 0.36, 0, 0.18, 0));
    for (const t of [-1, 0, 1]) f.add(mesh(GEO.sph, Y, 0.09, 0.09, 0.12, t * 0.14, 0.09, 0.3));
    chick.add(f); feet.push(f);
  }
  chick.userData = { rig, wings, feet, crest, tipPiv };
  chick.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return chick;
}
const chick = buildChick();

// animation helpers
function poseChick(t, mode, opts = {}) {
  const { rig, wings, feet, crest, tipPiv } = chick.userData;
  if (mode === 'run') {
    const f = opts.freq || 14, ph = t * f;
    const air = opts.air || 0;

const SONGS = {
  title: { bpm: 96, lead: 'triangle', lv: 0.05,
    mel: 'E5 - G5 - A5 G5 E5 - D5 - E5 - C5 - - - E5 - G5 - A5 G5 E5 - D5 - C5 - D5 - - -',

    mel: 'C5 E5 G5 E5 C6 - G5 - A5 G5 E5 G5 D5 - - - C5 E5 G5 E5 A5 - G5 - F5 E5 D5 E5 C5 - - -',
    bass: 'C3 E3 F3 G3 C3 A2 G2 C3' },
  cks: { bpm: 112, lead: 'triangle', lv: 0.055,
    mel: 'E5 - D5 E5 G5 - A5 - G5 E5 D5 - C5 - - - D5 - E5 G5 A5 - C6 - A5 G5 E5 G5 D5 - - -',
    bass: 'A2 A2 C3 C3 F2 G2 A2 G2' },
  oki: { bpm: 126, lead: 'square', lv: 0.03, pluck: true,
    mel: 'C5 E5 F5 G5 B5 - C6 - B5 G5 F5 - E5 - - - C5 E5 F5 E5 C5 - G4 - B4 C5 E5 - C5 - - -',
    bass: 'C3 C3 F2 G2 C3 C3 G2 C3' },
};
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const noteHz = n => 440 * Math.pow(2, (NOTE_IDX[n[0]] + (+n[n.length - 1] + 1) * 12 - 69) / 12);
for (const k in SONGS) { SONGS[k].mel = SONGS[k].mel.split(' '); SONGS[k].bass = SONGS[k].bass.split(' '); }
const music = { cur: null, step: 0, next: 0, timer: null, gain: null };
function musicNote(name, t, dur, type, vol, pluck) {
  if (!name || name === '-') return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(noteHz(name), t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + (pluck ? dur * 0.6 : dur));
  o.connect(g).connect(music.gain); o.start(t); o.stop(t + dur + 0.05);
}
function musicTick() {
  const s = SONGS[music.cur];
  if (!s || !actx || muted || actx.state !== 'running') { if (actx) music.next = actx.currentTime + 0.1; return; }
  const step = 60 / s.bpm / 2;
  if (music.next < actx.currentTime) music.next = actx.currentTime + 0.05;
  while (music.next < actx.currentTime + 0.25) {
    const i = music.step % s.mel.length;
    musicNote(s.mel[i], music.next, step * 0.95, s.lead, s.lv, s.pluck);
    if (i % 4 === 0) musicNote(s.bass[(i / 4) % s.bass.length], music.next, step * 3.6, 'triangle', 0.07);
    music.next += step; music.step++;
  }
}
function playMusic(key) {
  if (music.cur === key) return;
  music.cur = key; music.step = 0;
  if (actx) music.next = actx.currentTime + 0.15;
}
function startMusicEngine() {
  if (!actx || music.timer) return;
  music.gain = actx.createGain(); music.gain.gain.value = 1; music.gain.connect(actx.destination);
  music.next = actx.currentTime + 0.15;
  music.timer = setInterval(musicTick, 60);
}

  for (let i = 0; i < 7; i++) { const seg = mesh(GEO.cyl, trunk, 0.22 - i * 0.012, h / 7 + 0.05, 0.22 - i * 0.012, x, y + h / 14, 0); seg.rotation.z = -lean; g.add(seg); y += h / 7; x += lean * h / 7; }
  const leafM = flat(0x3f9a3a), leafM2 = flat(0x2f8a34);

    const l = mesh(GEO.sphLo, i % 2 ? leafM : leafM2, 0.32, 0.06, 1.5, 0, 0, 1.3); l.rotation.x = 0.45; p.add(l); g.add(p);

function weighted(list) {
  const tot = list.reduce((a, b) => a + b[1], 0); let r = Math.random() * tot;
  for (const [fn, w] of list) { if ((r -= w) <= 0) return fn(); }
  return list[0][0]();
}

/* ---------- obstacles & bugs ---------- */
function rockMesh(color) {
  const g = new THREE.Group();
  const r = mesh(GEO.dode, flat(color), rand(0.55, 0.68), rand(0.5, 0.62), rand(0.5, 0.6), 0, 0.38, 0);
  r.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3)); g.add(r);
  g.add(mesh(GEO.dode, flat(color - 0x0a0a0a), 0.28, 0.24, 0.28, rand(-0.5, 0.5), 0.15, 0.35));
  return g;
}
function bugMesh() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  if (Math.random() < 0.55) { // caterpillar
    const greens = [0x7fd14a, 0x5fbe3a];
    for (let i = 0; i < 4; i++) body.add(mesh(GEO.sph, clay(greens[i % 2], 0.6), 0.17, 0.17, 0.17, 0, 0.18, 0.3 - i * 0.22));
    const head = mesh(GEO.sph, clay(0x9be05c, 0.6), 0.21, 0.21, 0.21, 0, 0.26, 0.5); body.add(head);
    body.add(mesh(GEO.sph, flat(0x111111), 0.05, 0.05, 0.05, -0.08, 0.32, 0.68, false), mesh(GEO.sph, flat(0x111111), 0.05, 0.05, 0.05, 0.08, 0.32, 0.68, false));
    for (const s of [-1, 1]) { const a = mesh(GEO.cyl, flat(0x333333), 0.015, 0.25, 0.015, s * 0.08, 0.52, 0.55, false); a.rotation.z = s * -0.4; body.add(a); }
    g.userData.wiggle = true;
  } else { // ladybug
    const shell = mesh(new THREE.SphereGeometry(1, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), clay(0xe02a2a, 0.5), 0.32, 0.26, 0.38, 0, 0.08, 0); body.add(shell);
    body.add(mesh(GEO.sph, flat(0x151515), 0.16, 0.14, 0.14, 0, 0.12, 0.36));
    for (const [x, z] of [[-0.14, 0.05], [0.14, 0.05], [-0.12, -0.18], [0.12, -0.18], [0, 0.22]]) body.add(mesh(GEO.sphLo, flat(0x111111), 0.06, 0.03, 0.06, x, 0.3 - Math.abs(x) * 0.4, z, false));
    body.add(mesh(GEO.box, flat(0x111111), 0.01, 0.02, 0.6, 0, 0.33, -0.02, false));
  }
  // soft glow disc so bugs are easy to spot
  const halo = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20), new THREE.MeshBasicMaterial({ color: 0xfff4a0, transparent: true, opacity: 0.45, depthWrite: false }));
  halo.rotation.x = -Math.PI / 2; halo.position.y = 0.03; g.add(halo);
  g.userData.body = body;
  return g;
}
function finishArch() {
  const g = new THREE.Group();
  const tex = canvasTex(256, 32, (x, w, h) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) { x.fillStyle = (i + j) % 2 ? '#222' : '#fff'; x.fillRect(i * 16, j * 16, 16, 16); } }, false);
  for (const s of [-1, 1]) g.add(mesh(GEO.cyl, flat(0xff6a24), 0.18, 4.2, 0.18, s * 3.8, 2.1, 0));
  g.add(mesh(GEO.box, new THREE.MeshStandardMaterial({ map: tex }), 7.8, 0.9, 0.12, 0, 4.0, 0));
  const lineTex = canvasTex(256, 32, (x, w, h) => { for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++) { x.fillStyle = (i + j) % 2 ? '#333' : '#f5f5f5'; x.fillRect(i * 16, j * 16, 16, 16); } }, false);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(PATH_W, 0.8), new THREE.MeshStandardMaterial({ map: lineTex }));
  line.rotation.x = -Math.PI / 2; line.position.y = 0.03; line.receiveShadow = true; g.add(line);
  return g;
}

const game = {
  scene: null, L: null, li: 0, speed: 15, dist: 0, hp: 3, bugs: 0, state: 'idle',
  lane: 1, x: 0, y: 0, vy: 0, inv: 0, items: [], scenery: [], particles: [], backdrops: [],

};

function buildLevel(li) {
  const L = LEVELS[li], s = new THREE.Scene();
  game.scene = s; game.L = L; game.li = li;
  s.background = skyTex(L.sky);
  s.fog = new THREE.Fog(L.fog[0], L.fog[1], L.fog[2]);
  s.add(new THREE.HemisphereLight(...L.hemi));
  const sun = new THREE.DirectionalLight(L.sunColor, 0.85);
  sun.position.set(-6, 14, 4); sun.target.position.set(0, 0, -6);
  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
  sun.shadow.bias = -0.0006; s.add(sun, sun.target);

  game.pathTex = L.path(); game.pathTex.repeat.set(1, PATH_LEN / L.pathTile);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(PATH_W, PATH_LEN), new THREE.MeshStandardMaterial({ map: game.pathTex, roughness: 1 }));
  path.rotation.x = -Math.PI / 2; path.position.set(0, 0.012, -PATH_LEN / 2 + 14); path.receiveShadow = true; s.add(path);
  game.sideTex = L.side(); game.sideTex.repeat.set(300 / L.sideTile, PATH_LEN / L.sideTile);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(300, PATH_LEN), new THREE.MeshStandardMaterial({ map: game.sideTex, roughness: 1 }));
  side.rotation.x = -Math.PI / 2; side.position.set(0, 0, -PATH_LEN / 2 + 14); side.receiveShadow = true; s.add(side);

  game.items = []; game.scenery = []; game.particles = []; game.backdrops = []; game.seaTex = null;
  const sky = new THREE.Group(); s.add(sky);
  for (let i = 0; i < 6; i++) { const c = cloud(); c.position.set(rand(-90, 90), rand(28, 45), rand(-200, -120)); c.scale.setScalar(rand(1, 1.8)); sky.add(c); }

  if (L.id === 'oki') {
    game.seaTex = canvasTex(256, 256, (x, w, h) => {
      const g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, '#5fe0d8'); g.addColorStop(0.35, '#22b5c9'); g.addColorStop(1, '#1679b8');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 2;
      for (let i = 0; i < 26; i++) { const yy = Math.random() * h, xx = Math.random() * w; x.beginPath(); x.moveTo(xx, yy); x.quadraticCurveTo(xx + 10, yy - 4, xx + 22, yy); x.stroke(); }
    });
    game.seaTex.repeat.set(1, PATH_LEN / 30);
    const sea = new THREE.Mesh(new THREE.PlaneGeometry(220, PATH_LEN), new THREE.MeshStandardMaterial({ map: game.seaTex, roughness: 0.25, metalness: 0.1 }));
    sea.rotation.x = -Math.PI / 2; sea.position.set(9.5 + 110, 0.04, -PATH_LEN / 2 + 14); s.add(sea); game.sea = sea;
    const foam = new THREE.Mesh(new THREE.PlaneGeometry(1.2, PATH_LEN), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
    foam.rotation.x = -Math.PI / 2; foam.position.set(9.6, 0.06, -PATH_LEN / 2 + 14); s.add(foam); game.foam = foam;
    // distant island + sun
    const isl = new THREE.Group();
    isl.add(mesh(GEO.sphLo, flat(0x3f8f55), 28, 7, 12, 0, 0, 0, false), mesh(GEO.sphLo, flat(0x4f9f5a), 14, 9, 8, 10, 0, 2, false));
    isl.position.set(90, 0, -200); s.add(isl);
    const sunM = mesh(GEO.sphLo, new THREE.MeshBasicMaterial({ color: 0xfff3b0, fog: false }), 9, 9, 9, 60, 70, -260, false); s.add(sunM);
  }
  if (L.id === 'cks') {
    const hall = memorialHall(); hall.userData.z0 = -230; hall.userData.z1 = -95; game.backdrops.push(hall); s.add(hall);
    for (const sx of [-1, 1]) { const t = theatre(); t.position.x = sx * 36; t.userData.z0 = -190; t.userData.z1 = 60; game.backdrops.push(t); s.add(t); }
    const gate = cksGate(); gate.position.z = -30; addMover(gate, 'deco');
  }
  if (L.id === 'park') {
    // far hills / city edge
    for (let i = 0; i < 7; i++) { const h = mesh(GEO.sphLo, flat(pick([0x5ea85a, 0x6cb466, 0x4f9a4f])), rand(25, 45), rand(8, 16), 12, -140 + i * 45, 0, -170, false); s.add(h); }
  }
  // pre-populate scenery so the world isn't empty
  for (let z = 10; z > -130; z -= L.id === 'cks' ? 5 : 4) spawnScenery(z);
  game.finish = finishArch(); game.finish.position.z = -L.length; s.add(game.finish);
  chick.position.set(0, 0, 0); chick.rotation.set(0, 0, 0); chick.scale.setScalar(0.62); s.add(chick);
}

function addMover(obj, kind, extra = {}) {
  obj.userData = Object.assign(obj.userData || {}, { kind }, extra);
  game.scene.add(obj);
  (kind === 'rock' || kind === 'bug' ? game.items : game.scenery).push(obj);
  return obj;
}
let cksLampToggle = 0;
function spawnScenery(z) {
  const L = game.L, set = SCENERY[L.id];
  if (L.id === 'cks') {
    cksLampToggle++;
    for (const sx of [-1, 1]) {
      if (cksLampToggle % 2 === 0) { const l = cksLamp(); l.position.set(sx * 4.3, 0, z); addMover(l, 'deco'); }
      const o = weighted(set.near); o.position.set(sx * rand(7, 9), 0, z + rand(-1, 1)); addMover(o, 'deco');
      if (Math.random() < 0.25) { const f = juniper(); f.scale.setScalar(rand(1.4, 2)); f.position.set(sx * rand(14, 22), 0, z); addMover(f, 'deco'); }
    }
    return;
  }
  if (L.id === 'oki') {
    if (Math.random() < 0.85) { const o = weighted(set.near); o.position.set(-rand(5, 10), 0, z + rand(-1.5, 1.5)); o.rotation.y = rand(0, 6); addMover(o, 'deco'); }
    if (Math.random() < 0.3) { const o = weighted(set.far); o.position.set(-rand(14, 26), 0, z); o.rotation.y = rand(-0.5, 0.5) + Math.PI / 2; addMover(o, 'deco'); }
    if (Math.random() < 0.3) { const u = Math.random() < 0.6 ? umbrella() : palm(rand(4, 6)); u.position.set(rand(5, 8.5), 0, z); addMover(u, 'deco'); }
    if (Math.random() < 0.06) { const b = boat(); b.position.set(rand(20, 45), 0.05, z); b.rotation.y = rand(0, 6); addMover(b, 'deco', { bob: true }); }
    return;
  }
  for (const sx of [-1, 1]) {
    if (Math.random() < 0.8) { const o = weighted(set.near); o.position.set(sx * rand(5, 10), 0, z + rand(-1.5, 1.5)); o.rotation.y = sx > 0 ? Math.PI : 0; addMover(o, 'deco'); }
    if (Math.random() < 0.35) { const o = weighted(set.far); o.position.set(sx * rand(14, 26), 0, z); addMover(o, 'deco'); }
  }
}
const SPAWN_Z = -110;
function spawnRow() {
  const L = game.L, r = Math.random();
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  const rock = l => { const m = rockMesh(L.rock); m.position.set(LANES[l], 0, SPAWN_Z); addMover(m, 'rock'); };
  const bug = (l, dz = 0, y = 0.3) => { const m = bugMesh(); m.position.set(LANES[l], y, SPAWN_Z + dz); m.rotation.y = Math.PI; addMover(m, 'bug', { baseY: y }); };
  const hard = game.li * 0.12;
  if (r < 0.28) { rock(lanes[0]); bug(lanes[1]); }
  else if (r < 0.48 + hard) { rock(lanes[0]); rock(lanes[1]); bug(lanes[2]); }
  else if (r < 0.66 + hard * 0.5) { rock(lanes[0]); bug(lanes[0], 0, 2.0); bug(lanes[1], -3); }
  else if (r < 0.84) { for (let i = 0; i < 4; i++) bug(lanes[0], -i * 2.4); if (Math.random() < 0.5) rock(lanes[1]); }
  else { rock(lanes[0]); rock(lanes[1]); rock(lanes[2]); bug(lanes[1], 0, 2.1); } // all blocked: must jump
}
function burst(pos, colors, n = 10, up = 4) {
  for (let i = 0; i < n; i++) {
    const p = mesh(GEO.sphLo, flat(pick(colors)), 0.09, 0.09, 0.09, pos.x, pos.y + 0.4, pos.z, false);
    p.userData.v = new THREE.Vector3(rand(-3, 3), rand(1, up), rand(-2, 2)); p.userData.life = rand(0.4, 0.7);
    game.scene.add(p); game.particles.push(p);
  }
}

}

$('#levels').addEventListener('click', e => { const b = e.target.closest('.lv'); if (b) { ensureAudio(); SFX.peep(); startLevel(+b.dataset.level); } });
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  const [t, e] = VIEWS[b.dataset.view];
  // shortest rotation to target
  let d = ((t - viewer.theta) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  viewTarget = [viewer.theta + d, e]; setAuto(false);
}));
function setAuto(on) { viewer.auto = on; $('#autoBtn').setAttribute('aria-pressed', on); }
$('#autoBtn').addEventListener('click', () => { setAuto(!viewer.auto); viewTarget = null; });
$('#waveBtn').addEventListener('click', () => { ensureAudio(); SFX.peep(); viewer.wave = 1.6; });
const muteBtn = $('#muteBtn');
const musicBtn = $('#musicBtn');
function syncMute() {
  muteBtn.textContent = muted ? '✕' : '♪'; muteBtn.setAttribute('aria-pressed', !muted);
  musicBtn.textContent = muted ? '音樂：關' : '音樂：開'; musicBtn.setAttribute('aria-pressed', !muted);
}
syncMute();
function toggleMute() { muted = !muted; try { localStorage.setItem('chickrun-muted', muted ? '1' : '0'); } catch (e) {} syncMute(); ensureAudio(); }
muteBtn.addEventListener('click', toggleMute);
musicBtn.addEventListener('click', toggleMute);
// browsers only allow sound after the first tap/click/key
const unlockAudio = () => { ensureAudio(); };
addEventListener('pointerdown', unlockAudio, { capture: true });
addEventListener('keydown', unlockAudio, { capture: true });
$('#pauseBtn').addEventListener('click', () => togglePause());

function showBanner(html, ms) {
  ui.banner.innerHTML = html; ui.banner.hidden = false;
  clearTimeout(showBanner.t); if (ms) showBanner.t = setTimeout(() => ui.banner.hidden = true, ms);
}
function updateHud() {
  $('#hearts').innerHTML = [0, 1, 2].map(i => i < game.hp ? '♥' : '<span class="off">♥</span>').join('');
  $('#bugCount').textContent = game.bugs;
  const p = clamp(game.dist / game.L.length, 0, 1);
  $('#progFill').style.width = p * 100 + '%'; $('#progChick').style.left = p * 100 + '%';
}
function openModal(title, sub, stars, stats, actions) {
  $('#mTitle').textContent = title; $('#mSub').textContent = sub;
  $('#mStars').innerHTML = stars == null ? '' : [0, 1, 2].map(i => i < stars ? '★' : '<span class="off">★</span>').join('');
  $('#mStars').hidden = stars == null;
  $('#mStats').innerHTML = stats.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
  $('#mStats').hidden = !stats.length;
  const box = $('#mActions'); box.innerHTML = '';
  actions.forEach(([label, fn, primary]) => { const b = document.createElement('button'); b.className = 'btn' + (primary ? ' primary' : ''); b.textContent = label; b.onclick = () => { ensureAudio(); fn(); }; box.appendChild(b); });
  ui.modal.hidden = false; setTimeout(() => box.firstChild && box.firstChild.focus(), 50);
}
function closeModal() { ui.modal.hidden = true; }

/* ================= Flow ================= */
let mode = 'viewer';
function toViewer() {
  closeModal(); ui.banner.hidden = true; ui.hud.hidden = true; ui.title.hidden = false;
  mode = 'viewer'; game.state = 'idle'; playMusic('title');
  viewer.scene.add(chick); chick.position.set(0, 0, 0); chick.rotation.set(0, 0, 0); chick.scale.setScalar(1);
  chick.userData.rig.rotation.set(0, 0, 0); chick.userData.rig.scale.set(1, 1, 1); chick.visible = true;
  renderLevels();
}
function startLevel(li) {
  closeModal(); ui.title.hidden = true; ui.hud.hidden = false;
  buildLevel(li);
  Object.assign(game, { speed: game.L.speed, dist: 0, hp: 3, bugs: 0, lane: 1, x: 0, y: 0, vy: 0, inv: 0, spawnAcc: 0, nextGap: 22, sceneryAcc: 0, introT: 0, endT: 0, shake: 0, state: 'intro' });
  chick.visible = true;
  $('#hudLevel').textContent = game.L.name;
  updateHud(); mode = 'game'; playMusic(game.L.id);
  showBanner(`${game.L.name}<small><span>${game.L.tag}・吃小蟲、跳過石頭！</span></small>`, 1700);
  canvas.focus({ preventScroll: true });
}
function togglePause(force) {
  if (mode !== 'game') return;
  if (game.state === 'play' && force !== false) {
    game.state = 'paused'; playMusic(null);
    openModal('暫停中', game.L.name, null, [], [['繼續跑', () => { closeModal(); game.state = 'play'; music.cur = null; playMusic(game.L.id); }, true], ['重新開始', () => startLevel(game.li)], ['回到小雞', toViewer]]);
  } else if (game.state === 'paused') { closeModal(); game.state = 'play'; playMusic(game.L.id); }
}
function levelClear() {
  game.state = 'clear'; game.endT = 0; playMusic(null); SFX.win();
  const stars = game.hp, score = game.bugs * 10 + game.hp * 50;
  const prev = best[game.L.id];
  if (!prev || score > prev.score) best[game.L.id] = { stars: Math.max(stars, prev ? prev.stars : 0), score };
  else if (stars > prev.stars) prev.stars = stars;
  try { localStorage.setItem('chickrun-best', JSON.stringify(best)); } catch (e) {}
  setTimeout(() => {
    const last = game.li === LEVELS.length - 1;
    openModal(last ? '全部通關！' : '過關！', last ? '啾啾從公園一路跑到沖繩海邊了' : `${game.L.name} 完成`, stars,
      [[game.bugs, '吃到小蟲'], [game.hp, '剩下愛心'], [score, '分數']],
      [last ? ['回到小雞', toViewer, true] : ['下一關：' + LEVELS[game.li + 1].name, () => startLevel(game.li + 1), true], ['再玩一次', () => startLevel(game.li)], ...(last ? [] : [['回到小雞', toViewer]])]);
  }, 1600);
}
function gameOver() {
  game.state = 'over'; game.endT = 0; playMusic(null); SFX.lose();
  setTimeout(() => openModal('跌倒了…', `在 ${game.L.name} 跑了 ${Math.round(game.dist / game.L.length * 100)}%`, null,
    [[game.bugs, '吃到小蟲'], [Math.round(game.dist) + 'm', '距離'], [game.bugs * 10, '分數']],
    [['再試一次', () => startLevel(game.li), true], ['回到小雞', toViewer]]), 1100);
}

/* ================= Input ================= */
function moveLane(d) {
  if (game.state !== 'play') return;
  const n = clamp(game.lane + d, 0, 2); if (n !== game.lane) { game.lane = n; SFX.lane(); }
}
function jump() {
  if (game.state !== 'play') return;
  if (game.y <= 0.001) { game.vy = 11.5; SFX.jump(); }
}
addEventListener('keydown', e => {
  if (mode !== 'game') return;
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' ', 'Spacebar'].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') moveLane(1);
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ' || k === 'Spacebar') { ensureAudio(); jump(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') togglePause();
});
function holdBtn(id, fn) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ensureAudio(); b.classList.add('on'); fn(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('on')));
}
holdBtn('#tLeft', () => moveLane(-1)); holdBtn('#tRight', () => moveLane(1)); holdBtn('#tJump', jump);

// canvas pointer: orbit in viewer, swipe in game
const ptrs = new Map(); let pinch0 = 0, swipe = null;
canvas.addEventListener('pointerdown', e => {
  ensureAudio(); canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'viewer') { setAuto(false); viewTarget = null; viewer.idleT = 0; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } }
  else swipe = { x: e.clientX, y: e.clientY, t: performance.now(), done: false };
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (mode === 'viewer') {
    if (ptrs.size === 1) {
      viewer.theta -= (e.clientX - p.x) * 0.011;
      viewer.elev = clamp(viewer.elev + (e.clientY - p.y) * 0.008, -0.35, 1.35);
    } else if (ptrs.size === 2) {
      p.x = e.clientX; p.y = e.clientY;
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch0) viewer.r = clamp(viewer.r * pinch0 / d, 3.4, 11); pinch0 = d; return;
    }
    viewer.idleT = 0;
  } else if (swipe && !swipe.done) {
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) { moveLane(dx > 0 ? 1 : -1); swipe.done = true; }
    else if (dy < -30 && Math.abs(dy) > Math.abs(dx)) { jump(); swipe.done = true; }
  }
  p.x = e.clientX; p.y = e.clientY;
});
const endPtr = e => {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = 0;
  if (mode === 'game' && swipe && !swipe.done && performance.now() - swipe.t < 300) jump(); // tap = jump
  swipe = null;
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { if (mode === 'viewer') { e.preventDefault(); viewer.r = clamp(viewer.r * (1 + e.deltaY * 0.001), 3.4, 11); } }, { passive: false });
canvas.addEventListener('dblclick', () => { if (mode === 'viewer') { viewer.hopV = 6; SFX.peep(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') togglePause(); });

/* ================= Loop ================= */
let last = performance.now(), T = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (mode === 'viewer') updateViewer(dt); else updateGame(dt);
}
function updateViewer(dt) {
  viewer.idleT += dt;
  if (viewTarget) {
    viewer.theta = lerp(viewer.theta, viewTarget[0], 1 - Math.pow(0.002, dt));
    viewer.elev = lerp(viewer.elev, viewTarget[1], 1 - Math.pow(0.002, dt));
    if (Math.abs(viewer.theta - viewTarget[0]) < 0.002) viewTarget = null;
  } else if (viewer.auto) viewer.theta += dt * 0.45;
  else if (viewer.idleT > 6 && !ptrs.size) setAuto(true);
  // hop physics
  viewer.hopV -= 22 * dt; viewer.hop = Math.max(0, viewer.hop + viewer.hopV * dt); if (viewer.hop === 0) viewer.hopV = Math.max(viewer.hopV, 0);
  if (Math.random() < dt * 0.12 && viewer.hop === 0) viewer.hopV = 4.5;
  viewer.wave = Math.max(0, viewer.wave - dt);
  poseChick(T, 'idle', { hop: viewer.hop, hopFlap: viewer.hop * 0.8, wave: viewer.wave > 0 ? 1 : 0 });
  const portrait = camera.aspect < 1, r = viewer.r * (portrait ? 1.25 : 1.15);
  const tgt = new THREE.Vector3(0, portrait ? 0.85 : 0.55, 0);
  camera.position.set(Math.sin(viewer.theta) * Math.cos(viewer.elev) * r, 1.35 + Math.sin(viewer.elev) * r, Math.cos(viewer.theta) * Math.cos(viewer.elev) * r);
  camera.lookAt(tgt);
  renderer.render(viewer.scene, camera);
}
function updateGame(dt) {
  const g = game, L = g.L;
  if (g.state === 'paused') { renderer.render(g.scene, camera); return; }
  let move = 0;
  if (g.state === 'intro') {
    g.introT += dt;
    const k = clamp(g.introT / 1.6, 0, 1), e = k * k * (3 - 2 * k);
    chick.rotation.y = e * Math.PI;
    poseChick(T, k < 0.6 ? 'idle' : 'run', { freq: 10, hop: k < 0.5 ? Math.abs(Math.sin(g.introT * 8)) * 0.2 : 0 });
    if (g.introT > 1.7) { g.state = 'play'; showBanner('跑！', 600); }
  } else if (g.state === 'play') {
    g.speed = L.speed + (g.dist / L.length) * 4;
    move = g.speed * dt; g.dist += move;
    // lateral
    const tx = LANES[g.lane]; const prevX = g.x;
    g.x = lerp(g.x, tx, 1 - Math.pow(0.0005, dt));
    // vertical
    if (g.y > 0 || g.vy > 0) { g.vy -= 30 * dt; g.y += g.vy * dt; if (g.y <= 0) { g.y = 0; g.vy = 0; burst(chick.position, [0xffffff, 0xe8d8b0], 4, 1.5); } }
    chick.position.set(g.x, g.y, 0);
    chick.rotation.set(0, Math.PI, (g.x - prevX) / Math.max(dt, 1e-4) * -0.02);
    const sq = g.y > 0 ? clamp(g.vy * 0.01, -0.08, 0.1) : 0;
    chick.userData.rig.scale.set(1 - sq, 1 + sq, 1 - sq);
    poseChick(T, 'run', { freq: 6 + g.speed * 0.5, air: g.y > 0.05 });
    g.inv = Math.max(0, g.inv - dt);
    chick.visible = g.inv > 0 ? Math.floor(T * 14) % 2 === 0 : true;
    // spawn
    g.spawnAcc += move;
    if (g.spawnAcc >= g.nextGap && g.dist < L.length - 40) { g.spawnAcc = 0; g.nextGap = rand(...L.gap) * (1 - g.li * 0.03); spawnRow(); }
    g.sceneryAcc += move;
    const sg = L.id === 'cks' ? 5 : 4;
    while (g.sceneryAcc >= sg) { g.sceneryAcc -= sg; spawnScenery(-130 + g.sceneryAcc); }
    if (g.dist >= L.length) levelClear();
    updateHud();
  } else if (g.state === 'clear') {
    g.endT += dt;
    const k = clamp(g.endT / 0.8, 0, 1); move = g.speed * dt * (1 - k);
    chick.visible = true;
    chick.rotation.y = Math.PI * (1 - k * k * (3 - 2 * k));
    const hop = Math.abs(Math.sin(g.endT * 7)) * 0.9 * k;
    chick.position.y = hop;
    poseChick(T, k < 1 ? 'run' : 'idle', { freq: 12, hop: 0, hopFlap: hop * 1.5, wave: k >= 1 ? 1 : 0 });
  } else if (g.state === 'over') {
    g.endT += dt; chick.visible = true;
    chick.rotation.x = lerp(chick.rotation.x, -Math.PI / 2.2, 1 - Math.pow(0.01, dt));
    chick.position.y = Math.max(0, chick.position.y - dt * 2);
  }
  // scroll ground & move world
  const tileShift = move;
  g.pathTex.offset.y += tileShift / L.pathTile; g.sideTex.offset.y += tileShift / L.sideTile;
  if (g.seaTex) { g.seaTex.offset.y += tileShift / 30; g.seaTex.offset.x = Math.sin(T * 0.5) * 0.01; g.foam.position.x = 9.6 + Math.sin(T * 1.6) * 0.35; }
  if (g.finish) g.finish.position.z += move;
  const prog = clamp(g.dist / L.length, 0, 1);
  for (const b of g.backdrops) b.position.z = lerp(b.userData.z0, b.userData.z1, prog);
  for (let i = g.scenery.length - 1; i >= 0; i--) {
    const o = g.scenery[i]; o.position.z += move;
    if (o.userData.bob) o.position.y = 0.05 + Math.sin(T * 2 + o.position.z) * 0.1;
    if (o.position.z > 16) { g.scene.remove(o); g.scenery.splice(i, 1); }
  }
  for (let i = g.items.length - 1; i >= 0; i--) {
    const o = g.items[i], u = o.userData; o.position.z += move;
    if (u.kind === 'bug' && !u.gone) {
      o.position.y = u.baseY + Math.abs(Math.sin(T * 5 + o.position.z)) * 0.12;
      if (u.wiggle) u.body.children.forEach((c, j) => { if (j < 4) c.position.x = Math.sin(T * 10 + j) * 0.05; });
      else u.body.rotation.y = Math.sin(T * 3 + o.position.z) * 0.4;
    }
    if (u.fly) { u.vel.y -= 25 * dt; o.position.addScaledVector(u.vel, dt); o.rotation.x += dt * 8; }
    if (u.gone) { u.t += dt; o.scale.setScalar(Math.max(0.01, 1 + u.t * 4) * (1 - u.t * 3)); if (u.t > 0.3) o.visible = false; }
    // collisions
    if (g.state === 'play' && !u.done && Math.abs(o.position.z) < 0.7 && Math.abs(o.position.x - g.x) < 0.95) {
      if (u.kind === 'bug' && Math.abs((g.y + 0.7) - (u.baseY + 0.3)) < 1.15) {
        u.done = true; u.gone = true; u.t = 0; g.bugs++; SFX.eat();
        burst(o.position, [0xffe36a, 0x9be05c, 0xffffff], 9, 4);
        const bc = $('#bugCount'); bc.classList.remove('bump'); void bc.offsetWidth; bc.classList.add('bump');
      } else if (u.kind === 'rock' && g.y < 0.75 && g.inv <= 0) {
        u.done = true; u.fly = true; u.vel = new THREE.Vector3(rand(-3, 3), 6, -4);
        g.hp--; g.inv = 1.4; g.shake = 0.35; SFX.hit();
        burst(chick.position, [0xffe36a, 0xff6a24], 12, 5);
        updateHud();
        if (g.hp <= 0) gameOver();
      }
    }
    if (o.position.z > 14 || o.position.y < -5) { g.scene.remove(o); g.items.splice(i, 1); }
  }
  for (let i = g.particles.length - 1; i >= 0; i--) {
    const p = g.particles[i], u = p.userData; u.life -= dt;
    u.v.y -= 14 * dt; p.position.addScaledVector(u.v, dt); p.position.z += move;
    if (u.life <= 0) { g.scene.remove(p); g.particles.splice(i, 1); }
  }
  // camera
  g.shake = Math.max(0, g.shake - dt);
  const sh = g.shake > 0 ? g.shake * 0.6 : 0;
  const intro = g.state === 'intro' ? clamp(1 - g.introT / 1.6, 0, 1) : 0;
  const portrait = camera.aspect < 1;
  const cz = (portrait ? 8.6 : 7.4) - intro * 2.8, cy = (portrait ? 4.6 : 4.0) - intro * 1.8;
  camera.position.set(g.x * 0.55 + rand(-sh, sh), cy + chick.position.y * 0.3 + rand(-sh, sh), cz);
  camera.lookAt(g.x * 0.7, 1.1 + chick.position.y * 0.25 - intro * 0.2, -7 + intro * 7);
  renderer.render(g.scene, camera);
}

resize();
playMusic('title');
requestAnimationFrame(frame);
})();
</script>
